<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>聊天界面</title>
    <style>
        #msgList {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div id="msgList"></div>
    <input type="text" id="msgInput" placeholder="请输入消息">
    <button id="sendBtn">发送</button>

    <script>
        const msgList = document.getElementById('msgList');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        // 后端地址：换机器或改端口时只需同步修改这一行。
        const CHAT_API = 'http://127.0.0.1:8000/chat';

        sendBtn.addEventListener('click', async () => {
            const userText = msgInput.value.trim();
            if (!userText) return;

            const userDiv = document.createElement('div');
            userDiv.textContent = userText;
            msgList.appendChild(userDiv);
            msgInput.value = '';
            msgList.scrollTop = msgList.scrollHeight;

            try {
                console.log("标记A：即将执行fetch");
                const res = await fetch(CHAT_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userText })
                });
                console.log("标记B：fetch返回，拿到res");
                const data = await res.json();
                console.log("标记C：json解析完成");

                const botDiv = document.createElement('div');
                botDiv.textContent = res.ok
                    ? data.reply
                    : `请求失败：${data.detail || res.status}`;
                msgList.appendChild(botDiv);
                msgList.scrollTop = msgList.scrollHeight;
            } catch (err) {
                console.error("请求捕获异常：", err);
                const errDiv = document.createElement('div');
                errDiv.textContent = "请求失败：后端服务未启动或网络连接异常";
                msgList.appendChild(errDiv);
                msgList.scrollTop = msgList.scrollHeight;
            }
        })
    </script>
</body>
</html>
